<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <p>Nombre:<input type="name" name="Nombre" maxlength="40" placeholder="Nombre"></p>
        <p>Apellido: <input type="name" name="Apellido" maxlength="40" placeholder="Apellido"></p>
        <p>Sexo: <input type="radio" name="genero" value="Masculino" checked> Masculino
            <input type="radio" name="genero" value="Femenino">Femenino
        </p>
        <p>Edad: <input type="numer" min="1" max="120" value="20"> </p>
        <p>Email: <input type="email" name="email" placeholder="dominio de email de usuario"></p>
        <p>Usuario: <input type="text" name="usuario" placeholder="nombre usuario"> </p>
        <p>Password: <input type="password" name="password"> </p>
        <p>Confirmar Password:<input type="password" name="password" placeholder="confirmar contraseña"></p>

        <p>
            Tipo de servicio:
            <select name="tipo-servicio">
                <option>Free</option>
                <option>Standard</option>
                <option>Premium</option>
            </select>
        </p>

        <p>
            Tema:
            Política <input type="checkbox" value="politica">
            Negocios <input type="checkbox" value="Negocios">
            Tecnología <input type="checkbox" value="Tecnología">
            Salud <input type="checkbox" value="Salud">
        </p>

        <p>
            Agregue un comentario:
            <textarea>
                Deje su comentario ...
            </textarea>
        </p>

        <p>
            <button type="button">Boton de Enviar</button>

        </p>
    </form>


</body>

</html>
